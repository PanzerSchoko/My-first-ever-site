<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #ff0055;
            font-size: 36px;
        }

        .contact-links {
            margin: 40px auto;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Стили для ссылок-кнопок */
        .social-link {
            display: block;
            background-color: #202024;
            border: 1px solid #29292e;
            color: #00ffcc;
            text-decoration: none; /* Убираем подчеркивание у ссылки */
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .social-link:hover {
            background-color: #00ffcc;
            color: #121214;
            box-shadow: 0 0 15px #00ffcc;
            transform: scale(1.03); /* Кнопка чуть-чуть увеличивается */
        }

        /* Ссылка для возврата назад */
        .back-link {
            color: #aaaaaa;
            text-decoration: underline;
            display: inline-block;
            margin-top: 30px;
        }
        
        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Связаться со мной</h1>
    <p>Вы можете найти меня в социальных сетях или написать напрямую:</p>

    <div class="contact-links">
        <a href="#" target="_blank" class="social-link">Telegram</a>
        <a href="#" target="_blank" class="social-link">Instagram</a>
        <a href="#" target="_blank" class="social-link">Discord</a>
    </div>

    <a href="index.html" class="back-link">← Вернуться на главную</a>

</body>
</html>
