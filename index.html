<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Мое Портфолио</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Контейнер для шапки сайта */
        .profile-container {
            text-align: center;
            padding: 40px 20px;
        }

        /* Стили для твоей картинки */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Делает картинку круглой */
            border: 3px solid #00ffcc;
            object-fit: cover; /* Чтобы картинка не сплющивалась */
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        h1 {
            color: #00ffcc;
            margin-top: 15px;
            font-size: 32px;
        }

        /* Сетка для будущих проектов */
        .projects-grid {
            display: flex;
            gap: 20px; /* Отступы между карточками */
            max-width: 900px;
            width: 900px;
            padding: 20px;
            justify-content: center;
        }

        /* Карточка проекта */
        .card {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 20px;
            flex: 1; /* Растягивает карточки поровну */
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px); /* Карточка плавно приподнимается */
            border-color: #ff0055;
        }

        .card h3 {
            color: #ff0055;
            margin-top: 0;
        }

        button {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        button:hover {
            background-color: #00ffcc;
            color: #121214;
            box-shadow: 0 0 15px #00ffcc;
        }

        /* АДАПТИВНОСТЬ: Если экран меньше 768px (например, телефон) */
        @media (max-width: 768px) {
            .projects-grid {
                flex-direction: column; /* Карточки встанут друг под друга */
                width: 100%;
                padding: 10px;
            }
            .card {
                margin: 0 20px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="photo.jpg" alt="Мое фото" class="profile-img">
        <h1>Будущий Web-Dev Проект</h1>
        <p>Изучаю HTML, CSS и JavaScript. Создаю адаптивные сайты под любые экраны.</p>
    </div>

    <div class="projects-grid">
        <div class="card">
            <h3>Проект 1</h3>
            <p>Сайт-визитка для локального бизнеса. Полная адаптивность под смартфоны.</p>
        </div>
        <div class="card">
            <h3>Проект 2</h3>
            <p>Лендинг для доставки еды или интернет-магазина на чистом коде.</p>
        </div>
    </div>

    <button id="action-btn">Связаться со мной</button>

    <script>
        document.getElementById('action-btn').addEventListener('click', function() {
            alert('5.5м турков))');
        });
    </script>

</body>
</html>
